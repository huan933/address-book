server:
  port: 8080

spring:
  datasource:
    # 文件模式 H2：数据落在 backend/data/addressbook.mv.db，重启不丢；AUTO_SERVER 便于同时用控制台查看
    url: jdbc:h2:file:./data/addressbook;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: info
